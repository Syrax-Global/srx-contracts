# Standard Syrax CI job: no AI-tool attribution in commit messages.
#
# WHY THIS FILE EXISTS
# The local commit-msg hook (tools/githooks/commit-msg) only runs in a clone that
# has `git config core.hooksPath tools/githooks` set — local config that is not
# cloned and is silently absent on a fresh machine. That is how 24 attributed
# commits got through, and on 11 Sep the hook was found stored NON-EXECUTABLE in
# five repos (git skips a hook it cannot execute) and absent in 17 more. A CI job
# cannot be turned off locally, so it is the control that actually holds.
#
# HOW TO ADOPT (any Syrax repo)
#   Copy this file to .github/workflows/attribution-check.yml in the repo, commit,
#   push. Nothing else — it is self-contained and needs no hook, no Node, no deps.
#   See tools/ci/README-attribution-check.md.
#
# WHAT IT DOES
#   Checks EVERY commit a push or pull request adds (not just the head commit),
#   using the same pattern as tools/githooks/commit-msg. Fails closed: if it
#   cannot work out the commit range, it checks the whole branch rather than
#   passing. Event values reach the script through env, never spliced into it.

name: Attribution check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: attribution-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  no-ai-attribution:
    name: No AI attribution in commit messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # every commit in the range must be present

      - name: Check the commits being added
        env:
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          # Same pattern as tools/githooks/commit-msg. Deliberately narrow: it
          # catches attribution trailers and generation banners, not the bare
          # word "claude" (commit subjects like "root CLAUDE.md contradicted
          # itself" are legitimate and common).
          pattern='Co-[Aa]uthored-[Bb]y:.*\(Claude\|Anthropic\)\|noreply@anthropic\.com\|[Gg]enerated with.*Claude\|🤖 *[Gg]enerated\|Created by Claude\|written by Claude'

          # Work out which commits this event adds. Fail closed: an unknown or
          # all-zero base means check the whole branch, never nothing.
          if [ -n "${BASE:-}" ]; then
            range="${BASE}..HEAD"
          elif [ -n "${BEFORE:-}" ] && [ "${BEFORE}" != "0000000000000000000000000000000000000000" ]; then
            range="${BEFORE}..HEAD"
          else
            range=""     # first push of a branch, or unknown: check all reachable commits
          fi

          if [ -n "$range" ] && git rev-parse -q --verify "${range%%..*}" >/dev/null 2>&1; then
            commits=$(git rev-list "$range")
          else
            echo "no usable base ref — checking every commit on the branch (fail-closed)"
            commits=$(git rev-list HEAD)
          fi

          n=$(printf '%s\n' "$commits" | grep -c . || true)
          echo "checking ${n} commit(s)"

          fail=0
          for c in $commits; do
            body=$(git log -1 --format=%B "$c")
            if printf '%s' "$body" | grep -qi "$pattern"; then
              echo "::error::AI attribution in commit ${c}"
              printf '%s' "$body" | grep -in "$pattern" | sed 's/^/    /'
              fail=1
            fi
          done

          if [ "$fail" -ne 0 ]; then
            echo ""
            echo "Standing rule: nothing in any Syrax repo may state that this ecosystem"
            echo "was built by, or co-authored with, Claude/Anthropic or any AI tool."
            echo "Set \"includeCoAuthoredBy\": false in ~/.claude/settings.json so the"
            echo "trailer stops being added, and run: git config core.hooksPath tools/githooks"
            exit 1
          fi
          echo "clean."
