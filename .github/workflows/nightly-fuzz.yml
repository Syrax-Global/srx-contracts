name: Nightly — Heavy Fuzz Campaign

# Runs an extended Foundry invariant campaign every night.
# 1024 runs × 100 depth = ~100K randomized calls per invariant.
# Catches multi-step state corruption that the lighter PR run won't surface.
#
# Runs on Syrax's own runner (CI-02, Security ruling 15 Oct 2026), at night. Every action is pinned to an exact
# commit; Node and Foundry are pinned downloads whose sha256 is checked BEFORE anything is extracted (the same pins
# as ci.yml). The failure-trace artifact is kept for 7 days.

on:
  schedule:
    - cron: '0 3 * * *'   # 03:00 UTC daily (night)
  workflow_dispatch:       # manual trigger

env:
  FOUNDRY_PROFILE: ci

# Least privilege (board 79e7b84b, 11 Oct 2026): this workflow only reads the repository.
permissions:
  contents: read

jobs:
  invariant-campaign:
    name: Foundry invariant — heavy profile
    runs-on: [self-hosted, syrax-ephemeral, syrax-large]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node 20.19.3 (pinned download, sha256 checked)
        # nodejs.org/dist/v20.19.3/SHASUMS256.txt: 76272878069683c3a36b933d2f4842436a26b527daa930ae9346b477011ee2f3
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSL -o node.tar.gz https://nodejs.org/dist/v20.19.3/node-v20.19.3-linux-x64.tar.gz
          echo "76272878069683c3a36b933d2f4842436a26b527daa930ae9346b477011ee2f3  node.tar.gz" | sha256sum -c -
          tar -xzf node.tar.gz
          echo "$RUNNER_TEMP/node-v20.19.3-linux-x64/bin" >> "$GITHUB_PATH"

      - name: Install Node deps
        run: npm ci --ignore-scripts

      - name: Install Foundry v1.8.5 (pinned download, sha256 checked)
        # pinned 8 Oct 2026 (board 656063d0): the version run locally; bump deliberately with a re-run.
        # github.com/foundry-rs/foundry/releases/download/v1.8.5/foundry_v1.8.5_linux_amd64.sha256 (upstream's own checksum file)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/foundry" && cd "$RUNNER_TEMP/foundry"
          curl -fsSL -o foundry.tar.gz https://github.com/foundry-rs/foundry/releases/download/v1.8.5/foundry_v1.8.5_linux_amd64.tar.gz
          echo "6c66ffcc55fa4249197721baa3098bc208014ea1d8aa04b2ed50ac6bccffb226  foundry.tar.gz" | sha256sum -c -
          tar -xzf foundry.tar.gz
          echo "$RUNNER_TEMP/foundry" >> "$GITHUB_PATH"

      - name: Install forge-std
        run: mkdir -p lib && git clone --depth 1 --branch v1.16.1 https://github.com/foundry-rs/forge-std lib/forge-std   # pinned tag (was HEAD, so two runs of one commit could differ)

      - name: Run heavy invariant campaign
        run: forge test --match-path "test/foundry/invariant/*" -vvv

      - name: Upload failure traces on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: invariant-failure-trace
          retention-days: 7
          path: |
            foundry-out/
            *.log

  # ⛔ THE ECHIDNA JOB IS REMOVED, NOT DISABLED, AND THAT IS DELIBERATE.
  #
  # It reported success every night while testing nothing. Four independent
  # faults, each individually fatal: the config would not parse (bare hex
  # senders), crytic-compile chose Foundry in a job that never installed it,
  # the property contract lived outside hardhat's compiled paths, and hevm
  # defaults to a pre-Cancun fork while this codebase uses mcopy. All four were
  # masked by `continue-on-error: true` and a trailing `|| true`.
  #
  # Worse than the harness: the properties could not fail. admin was hardcoded
  # to an address the harness did not control while genesis() is admin-gated,
  # so genesisComplete stayed false and the headline property opened with
  # `if (!token.genesisComplete()) return true`.
  #
  # ⭐ A permanently-green job that tests nothing is worse than no job, because
  # it stops anyone looking. Everything it claimed to cover is now covered by
  # the Foundry invariant suite above, which runs, supports Cancun, and can
  # fail this workflow. If Echidna is reinstated later it must be added with a
  # job that is allowed to fail, and with at least one property proven able to
  # fail before it is trusted.
